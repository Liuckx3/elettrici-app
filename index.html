<!-- INSTALL PROMPT -->
<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner')?.style.setProperty('display','flex');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner')?.style.setProperty('display','none');
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; });
    document.getElementById('installBanner')?.style.setProperty('display','none');
  }
}
<\/script>

<style>
:root {
  --bg:#f0f4f8; --surface:#fff; --surface2:#e8edf3; --border:#d0d9e4;
  --accent:#0066cc;
  --col-charge:#1a78d4;
  --col-wait:#0040a0;
  --col-md:#c8a000;
  --col-ferma:#cc2200;
  --col-pct-hi:#1a8a3a; --col-pct-mid:#b37700; --col-pct-lo:#cc6000; --col-pct-crit:#cc2200;
  --text:#1a2535; --text-dim:#6b7a8d; --text-light:#aab4be;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --display:'Syne',sans-serif;
  --shadow:0 1px 4px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overflow-x:hidden}

.topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:2px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.topbar-title{font-family:var(--display);font-size:16px;font-weight:800}
.topbar-title span{color:var(--accent)}
.date-badge{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--accent);letter-spacing:.5px}

/* EXPORT BAR */
.export-bar{display:flex;align-items:center;gap:5px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.export-btn{flex:1;min-width:60px;display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 4px;background:#1a8a3a;border:none;color:#fff;border-radius:10px;font-family:var(--display);font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(26,138,58,.25)}
.export-btn:active{opacity:.85}
.export-btn.blue{background:var(--accent)}
.export-btn.pdf-btn{background:#c0392b}
.export-btn.json-out{background:#7c3aed}
.export-btn.json-in{background:#0891b2}
.export-btn .ico{font-size:14px}
.reset-btn{padding:9px 11px;background:#fff3e0;border:1.5px solid #f5a623;border-radius:10px;font-size:15px;cursor:pointer;flex-shrink:0}
.reset-btn:active{opacity:.8}
.save-bar{display:flex;align-items:center;gap:6px;padding:5px 14px;background:#f0f7f0;border-bottom:1px solid #c8e6c9;font-size:11px;color:#2e7d32;font-family:var(--mono)}

/* MODAL EXPORT */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.modal-title{font-family:var(--display);font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-dim);line-height:1}
.copy-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-bottom:10px}
.copy-table th{background:var(--surface2);padding:6px 8px;text-align:left;border:1px solid var(--border);font-size:11px;letter-spacing:.5px}
.copy-table td{padding:6px 8px;border:1px solid var(--border);vertical-align:top}
.copy-table tr:nth-child(even) td{background:#f8fafc}
.copy-area{width:100%;min-height:80px;padding:10px;font-family:var(--mono);font-size:12px;border:1.5px solid var(--border);border-radius:8px;resize:none;background:var(--surface2);color:var(--text)}
.copy-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:var(--display);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.copy-btn:active{opacity:.8}
.section-sep{margin:16px 0 10px;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);border-top:1px solid var(--border);padding-top:12px}
.pdf-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:14px;margin-bottom:10px;outline:none;color:var(--text)}
.pdf-input:focus{border-color:var(--accent)}

.view{display:none;padding:10px 10px 88px}
.view.active{display:block}

.group-lbl{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-light);padding:10px 4px 5px;margin-top:4px}

/* VEHICLE ROW */
.vrow{border-radius:11px;margin-bottom:5px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;user-select:none}
.vrow-hdr{display:flex;align-items:center;min-height:50px;padding:0 13px;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:11px;transition:border-color .15s}
.vrow.open .vrow-hdr{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px solid var(--border)}
.vrow.modified .vrow-hdr{border-color:var(--accent)}
.vrow-matr{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--accent);min-width:44px;flex-shrink:0}

.bat-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.bat-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim)}
.bat-track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.bat-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}
.stallo-chip{font-family:var(--mono);font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;flex-shrink:0}

.status-strip{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.strip-charge   {background:#dbeeff;color:var(--col-charge)}
.strip-wait     {background:#d6e4ff;color:var(--col-wait)}
.strip-md       {background:#fff3cc;color:var(--col-md)}
.strip-ferma    {background:#fdecea;color:var(--col-ferma)}
.strip-verificare{background:#e8edf3;color:#5a6a7a}

.vrow-body{display:none;background:#fafbfd;border:1.5px solid var(--border);border-top:none;border-bottom-left-radius:11px;border-bottom-right-radius:11px;padding:12px 14px 14px}
.vrow.open .vrow-body{display:block}

.field-group{margin-top:12px}
.field-lbl{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--text-dim);text-transform:uppercase;margin-bottom:7px;font-family:var(--mono);display:block}
.btn-grid{display:flex;flex-wrap:wrap;gap:6px}
.obtn{padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-dim);font-family:var(--mono);font-size:13px;cursor:pointer;transition:all .12s;font-weight:500;min-width:38px;text-align:center}
.obtn:active{transform:scale(.92)}
.obtn.sel        {background:var(--accent);     color:#fff;border-color:var(--accent);     font-weight:700}
.obtn.sel-charge {background:var(--col-charge); color:#fff;border-color:var(--col-charge); font-weight:700}
.obtn.sel-wait   {background:var(--col-wait);   color:#fff;border-color:var(--col-wait);   font-weight:700}
.obtn.sel-md     {background:#e6a000;           color:#fff;border-color:#e6a000;           font-weight:700}
.obtn.sel-ferma      {background:var(--col-ferma);  color:#fff;border-color:var(--col-ferma);  font-weight:700}
.obtn.sel-verificare {background:#5a6a7a;           color:#fff;border-color:#5a6a7a;           font-weight:700}
.obtn.dim            {opacity:.32;cursor:not-allowed;pointer-events:none}

input[type=range]{width:100%;-webkit-appearance:none;height:7px;background:var(--surface2);border-radius:4px;outline:none;border:1px solid var(--border);margin-top:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 1px 4px rgba(0,102,204,.4);cursor:pointer;border:2px solid #fff}

.note-inp{width:100%;padding:9px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;resize:none}
.note-inp:focus{border-color:var(--accent)}

/* FILOBUS ROW */
.frow{border-radius:11px;margin-bottom:5px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;user-select:none}
.frow-hdr{display:flex;align-items:center;min-height:50px;padding:0 13px;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:11px}
.frow.open .frow-hdr{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:1px solid var(--border)}
.frow.modified .frow-hdr{border-color:#7c3aed}
.frow-matr{font-family:var(--mono);font-size:15px;font-weight:500;color:#7c3aed;min-width:44px;flex-shrink:0}
.frow-seq{font-family:var(--mono);font-size:20px;font-weight:500;min-width:36px}
.frow-body{display:none;background:#fafbfd;border:1.5px solid var(--border);border-top:none;border-bottom-left-radius:11px;border-bottom-right-radius:11px;padding:12px 14px 14px}
.frow.open .frow-body{display:block}

.ordina-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px;background:#fff3e0;border:1.5px solid #f5a623;border-radius:11px;font-family:var(--display);font-size:14px;font-weight:700;color:#cc5500;cursor:pointer}
.ordina-btn:active{opacity:.8}
.ordine-list{margin-top:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:11px;overflow:hidden}
.ordine-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.ordine-row:last-child{border-bottom:none}
.ordine-pos{font-family:var(--mono);font-size:13px;font-weight:700;color:#cc5500;min-width:28px}
.ordine-matr{font-family:var(--mono);font-size:15px;font-weight:500;color:#7c3aed}
.ordine-seq{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-left:auto}

/* PIAZZALE */
.piaz-cols{display:flex;flex-direction:column;gap:10px}
.piaz-col{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.piaz-hdr{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-dim);display:flex;align-items:center;justify-content:space-between}
.piaz-hdr small{font-family:var(--mono);font-size:11px;color:var(--text-light);font-weight:400}
.piaz-slots{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px}
.slot-item{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.slot-inp{width:64px;padding:7px 8px;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:13px;font-weight:500;outline:none;text-align:center}
.slot-inp::placeholder{color:var(--text-light);font-size:11px}
.slot-inp:focus{background:#eef3fc}
.slot-del{padding:7px 8px;background:transparent;border:none;border-left:1px solid var(--border);cursor:pointer;color:var(--text-light);font-size:13px}
.slot-del:active{background:#fdecea;color:var(--col-ferma)}
.add-slot{padding:7px 11px;border-radius:8px;border:1.5px dashed var(--border);background:transparent;color:var(--text-light);font-size:20px;cursor:pointer}
.add-slot:active{border-color:var(--accent);color:var(--accent)}

.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:9px 20px;border-radius:30px;font-size:13px;opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.bot-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border);display:flex;padding:6px 0 env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(0,0,0,.07)}
.nav-tab{flex:1;padding:6px 4px;border:none;background:transparent;color:var(--text-dim);font-family:var(--sans);font-size:11px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-tab .ico{font-size:18px}
.nav-tab.active{color:var(--accent);font-weight:600}
</style>
</head>

function statoLabel(v){
  return v.mode==='pct'        ? v.pct+'%' :
         v.mode==='charging'   ? 'IN CARICA' :
         v.mode==='wait'       ? 'DA CARICARE' :
         v.mode==='md'         ? 'MD' :
         v.mode==='verificare' ? 'VERIFICARE' : 'FERMA';
}

function showExportModal(type){
  if(S.openEl){markMod(S.openEl);S.openEl=null;renderEl();}
  if(S.openFilo!==null){markMod('F'+S.openFilo);S.openFilo=null;renderFilo();}
  const modal = document.getElementById('exportModal');
  const content = document.getElementById('modalContent');
  const title = document.getElementById('modalTitle');
  modal.style.display = 'flex';

  if(type === 'tabella'){
    title.textContent = '📋 Copia tabella dati';
    content.innerHTML = buildTabellaHTML();
  } else {
    title.textContent = '📄 PDF Piazzale Ovest';
    content.innerHTML = buildPdfFormHTML();
  }
}

function closeModal(){
  document.getElementById('exportModal').style.display='none';
}
function closeModalOutside(e){
  if(e.target.id==='exportModal') closeModal();
}

// ── TABELLA TESTO ──
function statoBreve(v){
  if(v.mode==='pct')        return String(v.pct);
  if(v.mode==='charging')   return 'IC';
  if(v.mode==='wait')       return 'DC';
  if(v.mode==='md')         return 'MD';
  if(v.mode==='verificare') return 'VF';
  return 'FERMA';
}

function buildTabellaHTML(){
  const dateStr = today.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
  const uscenti = S.filo.filter(v=>v.seq!==null).sort((a,b)=>parseInt(a.seq.slice(1))-parseInt(b.seq.slice(1)));

  // Testo compatto per copia — niente intestazioni, tutto in fila
  let txt = '';
  [...S.el8, ...S.el12].forEach(v => {
    const parts = [v.matr, statoBreve(v), v.corsia||'', v.stallo||'', v.note||''];
    txt += parts.join('\t').replace(/\t+$/, '') + '\n';
  });
  txt += '\n';
  uscenti.forEach(v => {
    const parts = [v.matr, v.seq, v.note||''];
    txt += parts.join('\t').replace(/\t+$/, '') + '\n';
  });

  // Tabella visiva (con etichette estese per leggibilità a schermo)
  function elRows(arr){ return arr.map(v=>`
    <tr>
      <td>${v.matr}</td>
      <td><b>${statoLabel(v)}</b></td>
      <td>${v.corsia||''}</td>
      <td>${v.stallo||''}</td>
      <td style="color:var(--text-dim)">${v.note||''}</td>
    </tr>`).join(''); }

  return `
    <div class="section-sep">Elettrici — 8mt + 12mt</div>
    <table class="copy-table">
      <tr><th>MATR</th><th>STATO</th><th>CORSIA</th><th>STALLO</th><th>NOTE</th></tr>
      ${elRows([...S.el8,...S.el12])}
    </table>
    <div class="section-sep">Filosnodati in uscita</div>
    <table class="copy-table">
      <tr><th>MATR</th><th>USCITA</th><th>NOTE</th></tr>
      ${uscenti.map(v=>`<tr><td>${v.matr}</td><td><b>${v.seq}</b></td><td style="color:var(--text-dim)">${v.note||''}</td></tr>`).join('')}
    </table>
    <div class="section-sep">Testo da copiare su Excel</div>
    <p style="font-size:11px;color:var(--text-dim);margin-bottom:6px">
      Incolla su Excel — le colonne si separano automaticamente.<br>
      Legenda: <b>IC</b>=In carica &nbsp; <b>DC</b>=Da caricare &nbsp; <b>MD</b>=Ricarica esterna &nbsp; <b>VF</b>=Verificare
    </p>
    <textarea class="copy-area" id="copyArea" readonly>${txt}</textarea>
    <button class="copy-btn" onclick="copyText()">📋 Copia tutto il testo</button>
  `;
}

function copyText(){
  const area = document.getElementById('copyArea');
  area.select();
  try {
    navigator.clipboard.writeText(area.value).then(()=>showToast('✓ Testo copiato!'));
  } catch(e){
    document.execCommand('copy');
    showToast('✓ Testo copiato!');
  }
}

      <b style="font-family:var(--mono);color:var(--text)">P.LE OVEST ${today.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-')}.pdf</b>

function stampaPiazzale(){

  let tableRows = '';
  for(let i=0; i<maxLen; i++){
    tableRows += '<tr>' + zones.map(z=>{
      const v = S.piazzale[z][i]||'';
      return `<td>${v}</td>`;
    }).join('') + '</tr>';
  }

  const html = `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8">
  <title>P.LE OVEST ${dateStr.replace(/\//g,'-')}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;padding:20px;color:#111}
    .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;border-bottom:2px solid #0066cc;padding-bottom:10px}
    .title{font-size:20px;font-weight:800;color:#0066cc;letter-spacing:-0.3px}
    .meta{font-size:12px;color:#555;text-align:right;line-height:1.8}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#0066cc;color:#fff;padding:8px 10px;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase}
    td{padding:7px 10px;border:1px solid #d0d9e4;text-align:center;font-family:monospace;font-size:14px;font-weight:500}
    tr:nth-child(even) td{background:#f5f8fc}
    td:empty::after{content:'—';color:#ccc}
    .footer{margin-top:16px;font-size:10px;color:#aaa;text-align:right}
    @media print{body{padding:10px}.footer{position:fixed;bottom:10px;right:10px}}
  </style></head><body>
  <div class="header">
    <div>
      <div class="title">🗺 PIAZZALE OVEST</div>
      <div style="font-size:12px;color:#555;margin-top:3px">Monitoraggio veicoli</div>
    </div>
    <div class="meta">
      <div><b>Data:</b> ${dateStr}</div>
      <div><b>Operatore:</b> ${operatore}</div>
      <div><b>Ora:</b> ${new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>

    ${tableRows}
  </table>
  <div class="footer">Generato da Elettrici.APP — ${dateStr}</div>
  <script>window.onload=()=>{window.print()}<\/script>
  </body></html>`;

  // Apri in nuova finestra e lancia stampa automatica
  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const win  = window.open(url, '_blank');
  // Il file si chiama automaticamente P.LE OVEST gg-mm-aa grazie al tag <title>
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
  closeModal();
  showToast('✓ Scegli "Salva come PDF" nella finestra di stampa');
}

function renderEl(){
  let html = '';
  html += `<div class="group-lbl">Piccoli 8mt</div>`;
  S.el8.forEach(v  => { html += elRowHTML(v,'el8'); });
  html += `<div class="group-lbl" style="margin-top:8px">Grandi 12mt</div>`;
  S.el12.forEach(v => { html += elRowHTML(v,'el12'); });
  document.getElementById('elList').innerHTML = html;
}

  const id     = group+'-'+v.matr;
  const isOpen = S.openEl === id;
  const isMod  = S.mod.has(id);
  const col    = bCol(v.pct);

  let hdrRight = '';
  if(v.mode==='pct'){
    hdrRight = `
      <div class="bat-wrap">
        <div class="bat-lbl"><span>Batteria</span>
          <span style="color:${col};font-family:var(--mono);font-weight:600">${v.pct}%</span></div>
        <div class="bat-track"><div class="bat-fill" style="width:${v.pct}%;background:${col}"></div></div>
      </div>
      ${v.corsia?`<div class="stallo-chip">${v.corsia}${v.stallo}</div>`:''}`;
  } else {
    const map = {
      charging:  ['strip-charge',    '🔌 IN CARICA'],
      wait:      ['strip-wait',      '⏳ DA CARICARE'],
      md:        ['strip-md',        '🔋 MD'],
      ferma:     ['strip-ferma',     '🚫 FERMA'],
      verificare:['strip-verificare','🔍 VERIFICARE'],
    };
    const [cls,lbl] = map[v.mode];
    hdrRight = `<div class="status-strip ${cls}">${lbl}</div>`;
  }

  const bodyHTML = isOpen ? `
    <div class="vrow-body">
      <div class="field-group">
        <span class="field-lbl">Stato</span>
        <div class="btn-grid">
          <button class="obtn ${v.mode==='pct'       ?'sel':''}"          onclick="setElMode('${group}','${id}',${v.matr},'pct')">📊 % Batteria</button>
          <button class="obtn ${v.mode==='charging'  ?'sel-charge':''}"   onclick="setElMode('${group}','${id}',${v.matr},'charging')">🔌 In carica</button>
          <button class="obtn ${v.mode==='wait'      ?'sel-wait':''}"     onclick="setElMode('${group}','${id}',${v.matr},'wait')">⏳ Da caricare</button>
          <button class="obtn ${v.mode==='md'        ?'sel-md':''}"       onclick="setElMode('${group}','${id}',${v.matr},'md')">🔋 MD</button>
          <button class="obtn ${v.mode==='ferma'     ?'sel-ferma':''}"    onclick="setElMode('${group}','${id}',${v.matr},'ferma')">🚫 Ferma</button>
          <button class="obtn ${v.mode==='verificare'?'sel-verificare':''}" onclick="setElMode('${group}','${id}',${v.matr},'verificare')">🔍 Verificare</button>
        </div>
      </div>
      ${v.mode==='pct'?`
      <div class="field-group">
        <span class="field-lbl">% Batteria — <span id="sv-${id}" style="color:${col}">${v.pct}%</span></span>
        <input type="range" min="0" max="100" step="5" value="${v.pct}"
          oninput="liveSlider('${group}','${id}',${v.matr},this.value)">
      </div>
      <div class="field-group">
        <span class="field-lbl">corsia</span>
        <div class="btn-grid">
          ${ZONES.map(z=>`<button class="obtn ${v.corsia===z?'sel':''}" onclick="setElcorsia('${group}','${id}',${v.matr},'${z}')">${z}</button>`).join('')}
        </div>
      </div>
      ${v.corsia&&v.corsia!=='LAV'?`
      <div class="field-group">
        <span class="field-lbl">Stallo</span>
        <div class="btn-grid">
          ${STALLI.map(n=>`<button class="obtn ${v.stallo==n?'sel':''}" onclick="setElStallo('${group}','${id}',${v.matr},${n})">${n}</button>`).join('')}
        </div>
      </div>`:''}
      `:''}
      <div class="field-group">
        <span class="field-lbl">Note</span>
        <textarea class="note-inp" rows="2" placeholder="Note libere..."
          onchange="S['${group}'].find(x=>x.matr===${v.matr}).note=this.value;markMod('${id}')">${v.note}</textarea>
      </div>
    </div>` : '';

  return `
  <div class="vrow ${isOpen?'open':''} ${isMod?'modified':''}" id="vr-${id}"
    onclick="toggleEl(event,'${group}','${id}',${v.matr})">

      <div class="vrow-matr">${v.matr}</div>

function toggleEl(e, group, id, matr){
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(S.openEl===id){
    markMod(id); S.openEl=null;
  } else {
    if(S.openEl) markMod(S.openEl);
    S.openEl=id;
  }
  renderEl();
  setTimeout(()=>document.getElementById('vr-'+id)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function setElMode(group, id, matr, mode){
  const v=S[group].find(x=>x.matr===matr);
  v.mode=mode;
  if(mode!=='pct' && mode!=='verificare'){v.corsia='';v.stallo='';}
  markMod(id); S.openEl=id; renderEl();
}
function liveSlider(group, id, matr, val){
  S[group].find(x=>x.matr===matr).pct=parseInt(val);
  const el=document.getElementById('sv-'+id);
  if(el){el.textContent=val+'%';el.style.color=bCol(parseInt(val));}
}
function setElcorsia(group, id, matr, corsia){
  const v=S[group].find(x=>x.matr===matr);
  v.corsia=corsia; if(corsia==='LAV') v.stallo='';
  markMod(id); S.openEl=id; renderEl();
}
function setElStallo(group, id, matr, n){
  S[group].find(x=>x.matr===matr).stallo=n;
  markMod(id); S.openEl=id; renderEl();
}

function renderFilo(){
  const seqUsed={};
  S.filo.forEach(v=>{ if(v.seq) seqUsed[v.seq]=v.matr; });

  document.getElementById('filoList').innerHTML = S.filo.map(v=>{
    const isOpen=S.openFilo===v.matr;
    const isMod =S.mod.has('F'+v.matr);
    const seqCol=v.seq?'#cc5500':'var(--text-light)';

    const bodyHTML = isOpen ? `
    <div class="frow-body">
      <div class="field-group">
        <span class="field-lbl">Sequenza uscita</span>
        <div class="btn-grid">
          ${SEQS.map(s=>{
            const taken=seqUsed[s]&&seqUsed[s]!==v.matr;
            return `<button class="obtn ${v.seq===s?'sel':''} ${taken?'dim':''}"
              onclick="setSeq(${v.matr},'${s}',${taken})">${s}</button>`;
          }).join('')}
          <button class="obtn ${v.seq===null?'sel':''}"
            onclick="setSeq(${v.matr},null,false)">— Non esce</button>
        </div>
      </div>
      <div class="field-group">
        <span class="field-lbl">Note</span>
        <textarea class="note-inp" rows="2" placeholder="Es. LAV, METROMARE..."
          onchange="S.filo.find(x=>x.matr===${v.matr}).note=this.value;markMod('F${v.matr}')">${v.note}</textarea>
      </div>
    </div>` : '';

    return `
    <div class="frow ${isOpen?'open':''} ${isMod?'modified':''}" id="fr-${v.matr}"
      onclick="toggleFilo(event,${v.matr})">
      <div class="frow-hdr">
        <div class="frow-matr">${v.matr}</div>
        <div class="frow-seq" style="color:${seqCol}">${v.seq||'—'}</div>
        ${v.note?`<div style="flex:1;text-align:right;font-size:11px;color:var(--text-dim);font-family:var(--mono)">${v.note}</div>`:'<div style="flex:1"></div>'}
      </div>
      ${bodyHTML}
    </div>`;
  }).join('');
}

function toggleFilo(e, matr){
  if(e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA') return;
  if(S.openFilo===matr){
    markMod('F'+matr); S.openFilo=null;
  } else {
    if(S.openFilo!==null) markMod('F'+S.openFilo);
    S.openFilo=matr;
  }
  renderFilo();
  setTimeout(()=>document.getElementById('fr-'+matr)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function setSeq(matr, seq, blocked){
  if(blocked){showToast('⚠ Sequenza già assegnata');return;}
  S.filo.find(x=>x.matr===matr).seq=seq;
  markMod('F'+matr); S.openFilo=matr; renderFilo();
}

let ordineVisible=false;
function toggleOrdine(){
  ordineVisible=!ordineVisible;
  const div=document.getElementById('ordineList');
  if(!ordineVisible){div.style.display='none';return;}
  div.style.display='block';
  const uscenti=S.filo.filter(v=>v.seq!==null)
    .sort((a,b)=>parseInt(a.seq.slice(1))-parseInt(b.seq.slice(1)));
  if(!uscenti.length){
    div.innerHTML=`<div style="padding:14px;font-size:13px;color:var(--text-dim);text-align:center">Nessun veicolo assegnato</div>`;return;
  }
  div.innerHTML=`<div class="ordine-list">
    ${uscenti.map((v,i)=>`
      <div class="ordine-row">
        <div class="ordine-pos">${i+1}°</div>
        <div class="ordine-matr">${v.matr}</div>
        <div class="ordine-seq">${v.seq}</div>
        ${v.note?`<div style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">${v.note}</div>`:''}
      </div>`).join('')}
  </div>`;
}

function renderPiaz(){
  document.getElementById('piazCols').innerHTML=Object.entries(S.piazzale).map(([corsia,slots])=>{
    const zid=corsia.replace(/[^a-z0-9]/gi,'_');
    const filled=slots.filter(s=>s.trim()).length;
    return `
    <div class="piaz-col">
      <div class="piaz-hdr">${corsia}<small id="ph-${zid}">${filled} veicoli</small></div>
      <div class="piaz-slots">
        ${slots.map((s,i)=>`
          <div class="slot-item">
            <input class="slot-inp" type="text" inputmode="numeric" placeholder="Matr."
              maxlength="6" value="${s}"
              oninput="updSlot('${corsia}',${i},this.value,'${zid}')">
            <button class="slot-del" onclick="delSlot('${corsia}',${i})">✕</button>
          </div>`).join('')}
        <button class="add-slot" onclick="addSlot('${corsia}')">＋</button>
      </div>
    </div>`;
  }).join('');
}

function updSlot(corsia,i,val,zid){
  S.piazzale[corsia][i]=val.trim();
  const hdr=document.getElementById('ph-'+zid);
  if(hdr) hdr.textContent=S.piazzale[corsia].filter(s=>s.trim()).length+' veicoli';
  markMod('PIAZ');
}
function addSlot(corsia){S.piazzale[corsia].push('');renderPiaz();}
function delSlot(corsia,i){
  S.piazzale[corsia].splice(i,1);
  if(!S.piazzale[corsia].length) S.piazzale[corsia].push('');
  renderPiaz(); markMod('PIAZ');
}

function esportaJSON(){
  if(S.openEl){markMod(S.openEl);S.openEl=null;renderEl();}
  if(S.openFilo!==null){markMod('F'+S.openFilo);S.openFilo=null;renderFilo();}

  const data = {
    version:  1,
    savedAt:  new Date().toISOString(),
    date:     today.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}),
    el8:      S.el8.map(({matr,pct,corsia,stallo,note,mode})=>({matr,pct,corsia,stallo,note,mode})),
    el12:     S.el12.map(({matr,pct,corsia,stallo,note,mode})=>({matr,pct,corsia,stallo,note,mode})),
    filo:     S.filo.map(({matr,seq,note})=>({matr,seq,note})),
    piazzale: S.piazzale,
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const dateStr = today.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
  a.href     = url;
  a.download = 'elettrici_' + dateStr + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
  showToast('✓ File JSON scaricato — mandalo al PC');
}

function importaJSON(){
  document.getElementById('jsonFileInput').click();
}

function leggiJSON(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if(!data.version || !data.el8 || !data.el12 || !data.filo){
        showToast('⚠ File JSON non valido'); return;
      }
      // Merge dati nel stato corrente
      data.el8.forEach(d  => { const v=S.el8.find(x=>x.matr===d.matr);  if(v) Object.assign(v,d); });
      data.el12.forEach(d => { const v=S.el12.find(x=>x.matr===d.matr); if(v) Object.assign(v,d); });
      data.filo.forEach(d => { const v=S.filo.find(x=>x.matr===d.matr); if(v) Object.assign(v,d); });
      if(data.piazzale) Object.assign(S.piazzale, data.piazzale);
      // Salva in localStorage e aggiorna UI
      saveToStorage();
      S.openEl=null; S.openFilo=null;
      renderEl(); renderFilo();
      showToast('✓ Dati importati da: ' + file.name);
    } catch(err){
      showToast('⚠ Errore lettura file: ' + err.message);
    }
    input.value = ''; // reset input per permettere re-import
  };
  reader.readAsText(file);
}

// ══ PERSISTENZA localStorage ══
const LS_KEY = 'elettrici_data';

function saveToStorage(){
  try {
    const data = {
      el8:      S.el8.map(({matr,pct,corsia,stallo,note,mode})=>({matr,pct,corsia,stallo,note,mode})),
      el12:     S.el12.map(({matr,pct,corsia,stallo,note,mode})=>({matr,pct,corsia,stallo,note,mode})),
      filo:     S.filo.map(({matr,seq,note})=>({matr,seq,note})),
      piazzale: S.piazzale,
      savedAt:  new Date().toISOString(),
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    updateSaveLabel(data.savedAt);
  } catch(e){ console.warn('localStorage non disponibile', e); }
}

function loadFromStorage(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    // Merge: mantieni le matricole fisse, aggiorna solo i campi modificabili
    if(data.el8)  data.el8.forEach(d  => { const v=S.el8.find(x=>x.matr===d.matr);   if(v) Object.assign(v,d); });
    if(data.el12) data.el12.forEach(d => { const v=S.el12.find(x=>x.matr===d.matr);  if(v) Object.assign(v,d); });
    if(data.filo) data.filo.forEach(d => { const v=S.filo.find(x=>x.matr===d.matr);  if(v) Object.assign(v,d); });
    if(data.piazzale) Object.assign(S.piazzale, data.piazzale);
    updateSaveLabel(data.savedAt);
    return true;
  } catch(e){ return false; }
}

function updateSaveLabel(isoStr){
  const el = document.getElementById('lastSave');
  if(!el || !isoStr) return;
  const d = new Date(isoStr);
  el.textContent = 'Salvato ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

function resetDay(){
  if(!confirm('Resettare tutti i dati per iniziare una nuova giornata?')) return;
  localStorage.removeItem(LS_KEY);
  // Reset stato a valori iniziali
  S.el8.forEach(v  => { v.pct=100; v.corsia=''; v.stallo=''; v.note=''; v.mode='verificare'; });
  S.el12.forEach(v => { v.pct=100; v.corsia=''; v.stallo=''; v.note=''; v.mode='verificare'; });
  S.filo.forEach(v => { v.seq=null; v.note=''; });
  Object.keys(S.piazzale).forEach(k => { S.piazzale[k]=S.piazzale[k].map(()=>''); });
  S.openEl=null; S.openFilo=null; S.mod.clear();
  renderEl(); renderFilo();
  document.getElementById('lastSave').textContent = 'Nuova giornata';
  showToast('✓ Dati azzerati — nuova giornata');
}

// ══ SHARED ══
function markMod(id){
  S.mod.add(id);
  saveToStorage();
}

function nav(name, btn){
  if(S.openEl){markMod(S.openEl);S.openEl=null;renderEl();}
  if(S.openFilo!==null){markMod('F'+S.openFilo);S.openFilo=null;renderFilo();}
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(name==='piaz') renderPiaz();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ══ INIT ══
loadFromStorage();
renderEl();
renderFilo();
</script>
</body>
</html>
