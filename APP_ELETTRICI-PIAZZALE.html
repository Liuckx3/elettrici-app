<!-- SERVICE WORKER per uso offline -->
<script>
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'elettrici-v1';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { self.clients.claim(); });
    self.addEventListener('fetch', e => {
      if(e.request.url.startsWith('chrome-extension')) return;
      e.respondWith(
        caches.open(CACHE).then(cache =>
          fetch(e.request).then(resp => {
            cache.put(e.request, resp.clone());
            return resp;
          }).catch(() => caches.match(e.request))
        )
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const url  = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url, {scope:'./'}).catch(()=>{});
}
<\/script>

<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner')?.style.setProperty('display','flex');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner')?.style.setProperty('display','none');
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; });
    document.getElementById('installBanner')?.style.setProperty('display','none');
  }
}
<\/script>

// ══ UTILS ══
function bCol(p){ return p>=80?'var(--col-pct-hi)':p>=50?'var(--col-pct-mid)':p>=25?'var(--col-pct-lo)':'var(--col-pct-crit)'; }

// ══════════════════════════════════════════
// EXPORT EXCEL
// ══════════════════════════════════════════
function exportExcel(){
  // Chiudi eventuali righe aperte prima di esportare
  if(S.openEl)  { markMod(S.openEl);   S.openEl=null;   renderEl();   }
  if(S.openFilo!==null){ markMod('F'+S.openFilo); S.openFilo=null; renderFilo(); }

  const wb = XLSX.utils.book_new();
  const dateStr = today.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});

  // ── Foglio 1: ELETTRICI ──
  const elRows = [
    ['MONITORAGGIO VEICOLI ELETTRICI — '+dateStr],
    [],
    ['', 'PICCOLI 8mt (7111-7121)'],
    ['MATR', 'STATO / %', 'ZONA', 'STALLO', 'NOTE'],
  ];
  S.el8.forEach(v => {
    const stato = v.mode==='pct'        ? v.pct :
                  v.mode==='charging'   ? 'IN CARICA' :
                  v.mode==='wait'       ? 'DA CARICARE' :
                  v.mode==='md'         ? 'MD' :
                  v.mode==='verificare' ? 'VERIFICARE' : 'FERMA';
    elRows.push([v.matr, stato, v.zona||'', v.stallo||'', v.note||'']);
  });

  const wsEl = XLSX.utils.aoa_to_sheet(elRows);
  // Larghezze colonne
  wsEl['!cols'] = [{wch:10},{wch:14},{wch:8},{wch:8},{wch:30}];
  // Merge titolo
  wsEl['!merges'] = [{s:{r:0,c:0},e:{r:0,c:4}}];
  XLSX.utils.book_append_sheet(wb, wsEl, 'Elettrici');

  // ── Foglio 2: FILOSNODATI ──
  const filoRows = [
    ['FILOSNODATI — '+dateStr],
    [],
    ['MATR', 'SEQUENZA USCITA', 'NOTE'],
  ];
  // Ordinati per sequenza, poi quelli senza
  const uscenti = S.filo.filter(v=>v.seq!==null)
    .sort((a,b)=>parseInt(a.seq.slice(1))-parseInt(b.seq.slice(1)));
  const fermi   = S.filo.filter(v=>v.seq===null);
  uscenti.forEach(v => filoRows.push([v.matr, v.seq, v.note||'']));
  if(fermi.length){
    filoRows.push([]);
    filoRows.push(['— Non escono —','','']);
    fermi.forEach(v => filoRows.push([v.matr, '—', v.note||'']));
  }

  const wsFilo = XLSX.utils.aoa_to_sheet(filoRows);
  wsFilo['!cols'] = [{wch:10},{wch:16},{wch:30}];
  wsFilo['!merges'] = [{s:{r:0,c:0},e:{r:0,c:2}}];
  XLSX.utils.book_append_sheet(wb, wsFilo, 'Filosnodati');

  // ── Foglio 3: PIAZZALE ──
  const piazRows = [['PIAZZALE OVEST — '+dateStr],[]];
  const zones = Object.keys(S.piazzale);
  piazRows.push(zones);
  const maxLen = Math.max(...zones.map(z=>S.piazzale[z].length));
  for(let i=0;i<maxLen;i++){
    piazRows.push(zones.map(z=>S.piazzale[z][i]||''));
  }

  const wsPiaz = XLSX.utils.aoa_to_sheet(piazRows);
  wsPiaz['!cols'] = zones.map(()=>({wch:14}));
  wsPiaz['!merges'] = [{s:{r:0,c:0},e:{r:0,c:zones.length-1}}];
  XLSX.utils.book_append_sheet(wb, wsPiaz, 'Piazzale Ovest');

  // ── Download ──
  const fname = 'Monitoraggio_'+today.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-')+'.xlsx';
  XLSX.writeFile(wb, fname);

  // Update last export label
  document.getElementById('lastExport').innerHTML =
    'Esportato<br>'+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

  showToast('✓ File Excel scaricato!');
}

// ══════════════════════════════════════════
// RENDER ELETTRICI
// ══════════════════════════════════════════
function renderEl(){
  let html = '';
  html += `<div class="group-lbl">Piccoli 8mt</div>`;
  S.el8.forEach(v  => { html += elRowHTML(v,'el8'); });
  html += `<div class="group-lbl" style="margin-top:8px">Grandi 12mt</div>`;
  S.el12.forEach(v => { html += elRowHTML(v,'el12'); });
  document.getElementById('elList').innerHTML = html;
}

function elRowHTML(v, group){
  const id     = group+'-'+v.matr;
  const isOpen = S.openEl === id;
  const isMod  = S.mod.has(id);
  const col    = bCol(v.pct);

  let hdrRight = '';
  if(v.mode==='pct'){
    hdrRight = `
      <div class="bat-wrap">
        <div class="bat-lbl"><span>Batteria</span>
          <span style="color:${col};font-family:var(--mono);font-weight:600">${v.pct}%</span></div>
        <div class="bat-track"><div class="bat-fill" style="width:${v.pct}%;background:${col}"></div></div>
      </div>
      ${v.zona?`<div class="stallo-chip">${v.zona}${v.stallo}</div>`:''}`;
  } else {
    const map = {
      charging:  ['strip-charge',    '🔌 IN CARICA'],
      wait:      ['strip-wait',      '⏳ DA CARICARE'],
      md:        ['strip-md',        '🔋 MD'],
      ferma:     ['strip-ferma',     '🚫 FERMA'],
      verificare:['strip-verificare','🔍 VERIFICARE'],
    };
    const [cls,lbl] = map[v.mode];
    hdrRight = `<div class="status-strip ${cls}">${lbl}</div>`;
  }

  const bodyHTML = isOpen ? `
    <div class="vrow-body">
      <div class="field-group">
        <span class="field-lbl">Stato</span>
        <div class="btn-grid">
          <button class="obtn ${v.mode==='pct'       ?'sel':''}"          onclick="setElMode('${group}','${id}',${v.matr},'pct')">📊 % Batteria</button>
          <button class="obtn ${v.mode==='charging'  ?'sel-charge':''}"   onclick="setElMode('${group}','${id}',${v.matr},'charging')">🔌 In carica</button>
          <button class="obtn ${v.mode==='wait'      ?'sel-wait':''}"     onclick="setElMode('${group}','${id}',${v.matr},'wait')">⏳ Da caricare</button>
          <button class="obtn ${v.mode==='md'        ?'sel-md':''}"       onclick="setElMode('${group}','${id}',${v.matr},'md')">🔋 MD</button>
          <button class="obtn ${v.mode==='ferma'     ?'sel-ferma':''}"    onclick="setElMode('${group}','${id}',${v.matr},'ferma')">🚫 Ferma</button>
          <button class="obtn ${v.mode==='verificare'?'sel-verificare':''}" onclick="setElMode('${group}','${id}',${v.matr},'verificare')">🔍 Verificare</button>
        </div>
      </div>
      ${v.mode==='pct'?`
      <div class="field-group">
        <span class="field-lbl">% Batteria — <span id="sv-${id}" style="color:${col}">${v.pct}%</span></span>
        <input type="range" min="0" max="100" step="5" value="${v.pct}"
          oninput="liveSlider('${group}','${id}',${v.matr},this.value)">
      </div>
      <div class="field-group">
        <span class="field-lbl">Zona</span>
        <div class="btn-grid">
          ${ZONES.map(z=>`<button class="obtn ${v.zona===z?'sel':''}" onclick="setElZona('${group}','${id}',${v.matr},'${z}')">${z}</button>`).join('')}
        </div>
      </div>
      ${v.zona&&v.zona!=='LAV'?`
      <div class="field-group">
        <span class="field-lbl">Stallo</span>
        <div class="btn-grid">
          ${STALLI.map(n=>`<button class="obtn ${v.stallo==n?'sel':''}" onclick="setElStallo('${group}','${id}',${v.matr},${n})">${n}</button>`).join('')}
        </div>
      </div>`:''}
      `:''}
      <div class="field-group">
        <span class="field-lbl">Note</span>
        <textarea class="note-inp" rows="2" placeholder="Note libere..."
          onchange="S['${group}'].find(x=>x.matr===${v.matr}).note=this.value;markMod('${id}')">${v.note}</textarea>
      </div>
    </div>` : '';

  return `
  <div class="vrow ${isOpen?'open':''} ${isMod?'modified':''}" id="vr-${id}"
    onclick="toggleEl(event,'${group}','${id}',${v.matr})">
    <div class="vrow-hdr">
      <div class="vrow-matr">${v.matr}</div>
      ${hdrRight}
    </div>
    ${bodyHTML}
  </div>`;
}

function toggleEl(e, group, id, matr){
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(S.openEl===id){
    markMod(id); S.openEl=null;
  } else {
    if(S.openEl) markMod(S.openEl);
    S.openEl=id;
  }
  renderEl();
  setTimeout(()=>document.getElementById('vr-'+id)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function setElMode(group, id, matr, mode){
  const v=S[group].find(x=>x.matr===matr);
  v.mode=mode;
  if(mode!=='pct' && mode!=='verificare'){v.zona='';v.stallo='';}
  markMod(id); S.openEl=id; renderEl();
}
function liveSlider(group, id, matr, val){
  S[group].find(x=>x.matr===matr).pct=parseInt(val);
  const el=document.getElementById('sv-'+id);
  if(el){el.textContent=val+'%';el.style.color=bCol(parseInt(val));}
}
function setElZona(group, id, matr, zona){
  const v=S[group].find(x=>x.matr===matr);
  v.zona=zona; if(zona==='LAV') v.stallo='';
  markMod(id); S.openEl=id; renderEl();
}
function setElStallo(group, id, matr, n){
  S[group].find(x=>x.matr===matr).stallo=n;
  markMod(id); S.openEl=id; renderEl();
}

// ══════════════════════════════════════════
// RENDER FILOSNODATI
// ══════════════════════════════════════════
function renderFilo(){
  const seqUsed={};
  S.filo.forEach(v=>{ if(v.seq) seqUsed[v.seq]=v.matr; });

  document.getElementById('filoList').innerHTML = S.filo.map(v=>{
    const isOpen=S.openFilo===v.matr;
    const isMod =S.mod.has('F'+v.matr);
    const seqCol=v.seq?'#cc5500':'var(--text-light)';

    const bodyHTML = isOpen ? `
    <div class="frow-body">
      <div class="field-group">
        <span class="field-lbl">Sequenza uscita</span>
        <div class="btn-grid">
          ${SEQS.map(s=>{
            const taken=seqUsed[s]&&seqUsed[s]!==v.matr;
            return `<button class="obtn ${v.seq===s?'sel':''} ${taken?'dim':''}"
              onclick="setSeq(${v.matr},'${s}',${taken})">${s}</button>`;
          }).join('')}
          <button class="obtn ${v.seq===null?'sel':''}"
            onclick="setSeq(${v.matr},null,false)">— Non esce</button>
        </div>
      </div>
      <div class="field-group">
        <span class="field-lbl">Note</span>
        <textarea class="note-inp" rows="2" placeholder="Es. LAV, METROMARE..."
          onchange="S.filo.find(x=>x.matr===${v.matr}).note=this.value;markMod('F${v.matr}')">${v.note}</textarea>
      </div>
    </div>` : '';

    return `
    <div class="frow ${isOpen?'open':''} ${isMod?'modified':''}" id="fr-${v.matr}"
      onclick="toggleFilo(event,${v.matr})">
      <div class="frow-hdr">
        <div class="frow-matr">${v.matr}</div>
        <div class="frow-seq" style="color:${seqCol}">${v.seq||'—'}</div>
        ${v.note?`<div style="flex:1;text-align:right;font-size:11px;color:var(--text-dim);font-family:var(--mono)">${v.note}</div>`:'<div style="flex:1"></div>'}
      </div>
      ${bodyHTML}
    </div>`;
  }).join('');
}

function toggleFilo(e, matr){
  if(e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA') return;
  if(S.openFilo===matr){
    markMod('F'+matr); S.openFilo=null;
  } else {
    if(S.openFilo!==null) markMod('F'+S.openFilo);
    S.openFilo=matr;
  }
  renderFilo();
  setTimeout(()=>document.getElementById('fr-'+matr)?.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function setSeq(matr, seq, blocked){
  if(blocked){showToast('⚠ Sequenza già assegnata');return;}
  S.filo.find(x=>x.matr===matr).seq=seq;
  markMod('F'+matr); S.openFilo=matr; renderFilo();
}

let ordineVisible=false;
function toggleOrdine(){
  ordineVisible=!ordineVisible;
  const div=document.getElementById('ordineList');
  if(!ordineVisible){div.style.display='none';return;}
  div.style.display='block';
  const uscenti=S.filo.filter(v=>v.seq!==null)
    .sort((a,b)=>parseInt(a.seq.slice(1))-parseInt(b.seq.slice(1)));
  if(!uscenti.length){
    div.innerHTML=`<div style="padding:14px;font-size:13px;color:var(--text-dim);text-align:center">Nessun veicolo assegnato</div>`;return;
  }
  div.innerHTML=`<div class="ordine-list">
    ${uscenti.map((v,i)=>`
      <div class="ordine-row">
        <div class="ordine-pos">${i+1}°</div>
        <div class="ordine-matr">${v.matr}</div>
        <div class="ordine-seq">${v.seq}</div>
        ${v.note?`<div style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">${v.note}</div>`:''}
      </div>`).join('')}
  </div>`;
}

// ══════════════════════════════════════════
// RENDER PIAZZALE
// ══════════════════════════════════════════
function renderPiaz(){
  document.getElementById('piazCols').innerHTML=Object.entries(S.piazzale).map(([zona,slots])=>{
    const zid=zona.replace(/[^a-z0-9]/gi,'_');
    const filled=slots.filter(s=>s.trim()).length;
    return `
    <div class="piaz-col">
      <div class="piaz-hdr">${zona}<small id="ph-${zid}">${filled} veicoli</small></div>
      <div class="piaz-slots">
        ${slots.map((s,i)=>`
          <div class="slot-item">
            <input class="slot-inp" type="text" inputmode="numeric" placeholder="Matr."
              maxlength="6" value="${s}"
              oninput="updSlot('${zona}',${i},this.value,'${zid}')">
            <button class="slot-del" onclick="delSlot('${zona}',${i})">✕</button>
          </div>`).join('')}
        <button class="add-slot" onclick="addSlot('${zona}')">＋</button>
      </div>
    </div>`;
  }).join('');
}

function updSlot(zona,i,val,zid){
  S.piazzale[zona][i]=val.trim();
  const hdr=document.getElementById('ph-'+zid);
  if(hdr) hdr.textContent=S.piazzale[zona].filter(s=>s.trim()).length+' veicoli';
  markMod('PIAZ');
}
function addSlot(zona){S.piazzale[zona].push('');renderPiaz();}
function delSlot(zona,i){
  S.piazzale[zona].splice(i,1);
  if(!S.piazzale[zona].length) S.piazzale[zona].push('');
  renderPiaz(); markMod('PIAZ');
}

// ══ SHARED ══
function markMod(id){ S.mod.add(id); }

function nav(name, btn){
  if(S.openEl){markMod(S.openEl);S.openEl=null;renderEl();}
  if(S.openFilo!==null){markMod('F'+S.openFilo);S.openFilo=null;renderFilo();}
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(name==='piaz') renderPiaz();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ══ INIT ══
renderEl();
renderFilo();
</script>
</body>
</html>
